# 로컬 개발용 MySQL. 운영 DB 와 같은 메이저 버전(8.4)을 쓴다.
# 호스트 포트는 3307 — 다른 프로젝트의 MySQL(3306)과 겹치지 않게.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jobbell
      MYSQL_USER: jobbell
      MYSQL_PASSWORD: jobbell
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    # mysqladmin ping 은 접속이 거부돼도 성공한다. 실제 계정으로 TCP 쿼리가 돌아야 healthy (deploy/compose.prod.yaml 참고).
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 --protocol=tcp -ujobbell -pjobbell -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      retries: 10

volumes:
  mysql-data:
