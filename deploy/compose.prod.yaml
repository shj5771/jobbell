# 운영 서버 1대 구성. deploy/deploy.sh 가 app-blue / app-green 을 번갈아 띄운다.
# 사용: cd deploy && cp .env.example .env (채우기) && ./deploy.sh
name: jobbell

x-app: &app
  image: ${IMAGE}:${TAG}
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
  environment: &app-env
    SPRING_PROFILES_ACTIVE: prod
    DB_URL: jdbc:mysql://mysql:3306/jobbell
    DB_USERNAME: jobbell
    DB_PASSWORD: ${MYSQL_PASSWORD}
    DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID}
    DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY}
    DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
    OPS_WEBHOOK_URL: ${OPS_WEBHOOK_URL}
    # 기동 시 슬래시 명령 등록. 가짜 토큰으로 구성을 점검할 때만 false 로 끈다.
    APP_DISCORD_REGISTER_COMMANDS: ${REGISTER_COMMANDS:-true}
    # 서버 메모리가 작다. 앱 두 개가 배포 중 잠깐 함께 뜨는 것까지 감안한 상한.
    JAVA_TOOL_OPTIONS: -Xmx384m -XX:+ExitOnOutOfMemoryError
  volumes:
    - app-logs:/app/logs

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jobbell
      MYSQL_USER: jobbell
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    # mysqladmin ping 은 접속이 거부돼도 "alive" 로 성공한다. 첫 기동 초기화(사용자 생성) 중에도 healthy 가 되어
    # 앱이 먼저 붙고 Access denied 로 죽었다. 실제 계정으로 TCP 접속해 쿼리가 돌아야 healthy 로 본다 —
    # 초기화 중의 임시 서버는 TCP 를 열지 않으므로 진짜 서버가 뜬 뒤에만 통과한다.
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 --protocol=tcp -ujobbell -p$$MYSQL_PASSWORD -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  # 두 컨테이너가 같은 로그 파일에 쓰면 줄이 섞여 JSON 이 깨진다. 색마다 파일을 나눈다.
  app-blue:
    <<: *app
    environment:
      <<: *app-env
      APP_LOGGING_FILE: /app/logs/jobbell-blue.log
      APP_LOGGING_INSTANCE: blue
  app-green:
    <<: *app
    environment:
      <<: *app-env
      APP_LOGGING_FILE: /app/logs/jobbell-green.log
      APP_LOGGING_INSTANCE: green

  nginx:
    image: nginx:1.30.6
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      # deploy.sh 가 바꿔 쓰는 파일. 지금 트래픽을 받는 색을 가리킨다.
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.inc:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/acme:ro

  # 인증서 발급·갱신. 처음 한 번: docker compose run --rm certbot certonly --webroot -w /var/www/acme -d $DOMAIN
  certbot:
    image: certbot/certbot:v5.8.0
    profiles: ["tools"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/acme

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  # 앱이 쓰는 JSON 로그 파일을 읽어 Loki 로 보낸다.
  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command: run /etc/alloy/config.alloy --storage.path=/var/lib/alloy
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - app-logs:/logs:ro
      - alloy-data:/var/lib/alloy
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    # 밖으로 열지 않는다. ssh -L 3000:localhost:3000 <서버> 로 접속한다.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  mysql-data:
  app-logs:
  letsencrypt:
  acme-webroot:
  loki-data:
  alloy-data:
  grafana-data:
