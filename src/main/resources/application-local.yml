# 개발 PC: 파일은 남기지 않는다. 콘솔로 내부 흐름까지 다 본다.
spring:
  datasource:
    # compose.yaml 의 로컬 MySQL
    url: jdbc:mysql://localhost:3307/jobbell
    username: jobbell
    password: jobbell

app:
  logging:
    env: local
  # local 은 디스코드 없이 curl 로 인터랙션을 흉내 낸다. 서명 검증은 local 에서만 끌 수 있다(DiscordStartupGuard).
  discord:
    verify-signature: false
  # 가짜 출처라 외부 부담이 없다. 흐름을 빨리 보려고 1분.
  collect:
    interval: PT1M
  # 가짜 출처만 쓴다. broken·empty 는 조용한 실패를 재현하기 위한 예약 키다(FakePostingSource).
  catalog:
    companies:
      - { name: 가짜전자, source: fake, key: acme }
      - { name: 가짜게임즈, source: fake, key: globex }
      - { name: 장애상사, source: fake, key: broken }
      - { name: 빈응답상사, source: fake, key: empty }

logging:
  level:
    io.github.shj5771.jobbell: DEBUG
