# 운영: 우리 코드는 INFO, 프레임워크 소음은 WARN 이상만.
# 장애 분석에 필요하니 30일 보관하되 파일 하나와 총량 양쪽으로 상한을 건다.
spring:
  datasource:
    # 기본값을 두지 않는다. 하나라도 빠지면 기동이 실패해야 한다.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  discord:
    register-commands: true
  logging:
    env: prod
    max-history: 30
    total-size-cap: 3GB
  # 운영 카탈로그는 스터디가 고른 관심 기업으로 채운다. 출처마다 공개 허용 여부를 확인한 것만 넣는다.
  catalog:
    companies: []

logging:
  level:
    root: WARN
    io.github.shj5771.jobbell: INFO
