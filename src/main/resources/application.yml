spring:
  application:
    name: jobbell
  profiles:
    # 프로파일을 주지 않은 실행은 local 로 고정한다.
    # 어느 환경도 아닌 네 번째 상태에서만 나는 버그를 만들지 않기 위해서다.
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션만 바꾼다. 엔티티와 어긋나면 기동 시 실패한다.
      ddl-auto: validate
    properties:
      # 시각은 Instant 로 다루고 DB 에는 UTC 로 쓴다. 서버·컨테이너 시간대가 달라도 값이 흔들리지 않는다.
      hibernate.jdbc.time_zone: UTC

# 로깅 설정의 소유권을 나눈다.
#   application*.yml   — 레벨(무엇을 남길지), 파일 보관 정책 값
#   logback-spring.xml — appender/encoder 구조(어디에 어떤 모양으로 쓸지)
app:
  logging:
    env: local
    # 컨테이너 안에서는 HOSTNAME 이 컨테이너 ID 다. 배포 중 두 컨테이너의 로그를 이것으로 가른다.
    instance: ${HOSTNAME:local}
    file: logs/jobbell.log
    max-file-size: 100MB
    max-history: 3
    total-size-cap: 1GB
    async:
      queue-size: 2048
      discarding-threshold: 0
      never-block: false
      max-flush-time: 5000
  # 수집 주기. 출처 정책상 10분보다 짧게 두지 않는다(설계서 6장). local 만 예외.
  collect:
    initial-delay: PT10S
    interval: PT10M
  # 비밀값은 환경변수로만 받는다. 저장소에는 .env.example 만 있다.
  discord:
    application-id: ${DISCORD_APPLICATION_ID:}
    public-key: ${DISCORD_PUBLIC_KEY:}
    bot-token: ${DISCORD_BOT_TOKEN:}
    api-base-url: https://discord.com/api/v10
    register-commands: false
    verify-signature: true
    # 운영 봇의 애플리케이션 ID(비밀이 아니다). prod 가 아닌데 이 ID 로 뜨면 기동을 막는다.
    production-application-id: ""
  sources:
    greenhouse:
      base-url: https://boards-api.greenhouse.io

logging:
  level:
    root: INFO
    io.github.shj5771.jobbell: INFO
