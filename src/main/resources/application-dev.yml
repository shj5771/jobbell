# 테스트 봇·테스트 서버로 돌리는 환경: 콘솔에 더해 파일로도 남긴다. 보관은 3일이면 충분.
spring:
  datasource:
    # compose.yaml 의 로컬 MySQL
    url: jdbc:mysql://localhost:3307/jobbell
    username: jobbell
    password: jobbell

app:
  logging:
    env: dev
    max-history: 3
    total-size-cap: 1GB

logging:
  level:
    io.github.shj5771.jobbell: DEBUG
