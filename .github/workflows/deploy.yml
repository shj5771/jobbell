name: Deploy

# main 에 들어온 커밋을 테스트 → 이미지 → 서버 순서로 보낸다.
# 서버가 준비되기 전에는 돌지 않는다: 저장소 변수 DEPLOY_ENABLED=true 를 켜거나, 수동 실행(workflow_dispatch)만.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/shj5771/jobbell

jobs:
  image:
    if: vars.DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # 이미지에 담는 jar 는 테스트를 통과한 것이어야 한다.
      - run: ./gradlew build
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  server:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      # 서버에는 저장소가 ~/jobbell 로 클론돼 있고 deploy/.env 가 채워져 있어야 한다(docs/operations.md).
      # 배포 파일도 이미지와 같은 커밋으로 맞춘다.
      - uses: appleboy/ssh-action@v1.2.5
        env:
          SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SHA,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/jobbell
            git fetch --quiet origin
            git checkout --quiet --detach "$SHA"
            ./deploy/deploy.sh "$SHA"
