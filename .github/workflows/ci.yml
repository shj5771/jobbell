name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # 테스트가 Testcontainers 로 MySQL 을 띄운다. ubuntu 러너에는 Docker 가 기본으로 있다.
      - run: ./gradlew build
